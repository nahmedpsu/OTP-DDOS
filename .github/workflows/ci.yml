name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get install -y redis-server
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Scenarios and analysis (memory backend)
        run: |
          python scripts/run_scenarios.py --out /tmp/results
          python scripts/run_analysis.py --out /tmp/results
          python scripts/run_evaluation.py --quick --out /tmp/results
          python scripts/generate_synthetic_logs.py --out /tmp/logs.csv --minutes 8 --attack-start-minute 3
          python scripts/replay_logs.py --input /tmp/logs.csv
      - name: Pseudocode is in sync with the design
        run: |
          python scripts/extract_pseudocode.py
          git diff --exit-code docs/pseudocode
