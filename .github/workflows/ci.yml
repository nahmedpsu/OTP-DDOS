name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Scenarios (memory backend)
        run: python scripts/run_scenarios.py --out /tmp/results
      - name: Pseudocode is in sync with the design
        run: |
          python scripts/extract_pseudocode.py
          git diff --exit-code docs/pseudocode
