[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "otp-guard"
version = "2.8.3"
description = "OTP flood protection: a layered SMS validation, risk-scoring and rate-limiting pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "redis>=5",
    "requests>=2.31",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "cryptography>=41",
    "cbor2>=5",
]

[project.optional-dependencies]
google = ["google-auth>=2.29"]
eval = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]
dev = ["pytest>=8", "fakeredis[lua]>=2.23", "httpx>=0.27", "numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8"]

[project.scripts]
otp-guard-api = "otp_guard.api:main"
otp-guard-worker = "otp_guard.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "tests/unit"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning:starlette.*", "ignore:.*httpx.*:DeprecationWarning"]
